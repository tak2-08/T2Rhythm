name: Private phone streaming
on:
  pull_request:
    branches: ["main"]
    paths: ["app/**", "gradle/**", "scripts/run_private_streaming_regression.sh", ".github/workflows/private-streaming-regression.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-streaming-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            platform: "29"
          - api: 35
            platform: "35"
          - api: 37
            platform: "37.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --console=plain
      - name: Verify encrypted hosting, playback and native flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.platform }}
          system-image-api-level: ${{ matrix.platform }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: bash scripts/run_private_streaming_regression.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: private-streaming-api${{ matrix.api }}
          path: |
            app/build/outputs/private-streaming-regression/
            app/build/outputs/private-streaming-screenshots/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14
