name: Private phone streaming
on:
  pull_request:
    branches: ["main"]
    paths: ["app/**", "gradle/**", "scripts/run_private_streaming_regression.sh", "scripts/run_update_install_lifecycle.sh", ".github/workflows/private-streaming-regression.yml"]
  workflow_dispatch:
    inputs:
      update_only:
        description: Verify actual package replacement and APK cleanup on API35 before PR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: private-streaming-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.update_only && fromJSON('[{"api":35,"platform":"35"}]') || fromJSON('[{"api":29,"platform":"29"},{"api":35,"platform":"35"},{"api":37,"platform":"37.0"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update SDK tools for minor API versions
        if: matrix.api == 37
        shell: bash
        run: |
          # Old avdmanager writes target=android-0 for android-37.0. This causes
          # SurfaceFlinger/RegionSampling crash loops even after boot_completed.
          # sdkmanager is added to PATH by emulator-runner, which has not run yet.
          stream_sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$stream_sdkmanager" --licenses > /dev/null || true
          "$stream_sdkmanager" --install 'cmdline-tools;latest'
          if [[ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/t2-old-cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Build APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - name: Prepare next-version test fixture before starting the emulator
        if: inputs.update_only
        run: |
          current_name=$(python3 -c 'import pathlib,re; print(re.search(r"versionName = overrideVersionName \?: \"([0-9.]+)\"",pathlib.Path("app/build.gradle.kts").read_text()).group(1))')
          cp "app/build/outputs/apk/github/debug/Rhythm-$current_name-githubDebug.apk" "$RUNNER_TEMP/t2-current.apk"
          read -r t2_code t2_name < <(python3 -c 'import pathlib,re; t=pathlib.Path("app/build.gradle.kts").read_text(); c=int(re.search(r"versionCode = overrideVersionCode \?: (\d+)",t).group(1))+1; n=re.search(r"versionName = overrideVersionName \?: \"([0-9.]+)\"",t).group(1).split("."); n[-1]=str(int(n[-1])+1); print(c,".".join(n))')
          ./gradlew :app:assembleGithubDebug "-PversionCodeOverride=$t2_code" "-PversionNameOverride=$t2_name" --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
          cp "app/build/outputs/apk/github/debug/Rhythm-$t2_name-githubDebug.apk" "$RUNNER_TEMP/t2-future.apk"
      - name: Write package replacement runner
        if: inputs.update_only
        run: |
          cat > "$RUNNER_TEMP/t2-install-check.sh" <<'SCRIPT'
          set -euo pipefail
          adb install -r -t "$RUNNER_TEMP/t2-current.apk"
          adb install -r -t app/build/outputs/apk/androidTest/github/debug/app-github-debug-androidTest.apk
          export T2_UPDATE_FIXTURE="$RUNNER_TEMP/t2-future.apk"
          bash scripts/run_update_install_lifecycle.sh
          SCRIPT
      - name: Verify encrypted hosting, playback and native flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.platform }}
          system-image-api-level: ${{ matrix.platform }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 4096M
          ram-size: ${{ matrix.api == 37 && '4096M' || '2048M' }}
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          # emulator-runner executes pre-launch input one line at a time.
          pre-emulator-launch-script: >-
            python3 -c 'import os,pathlib; text=(pathlib.Path(os.environ["ANDROID_AVD_HOME"])/"test.ini").read_text(); print(text); assert "${{ matrix.api }}" != "37" or "target=android-37.0" in text, "Update avdmanager before booting API37"'
          script: ${{ inputs.update_only && format('bash {0}/t2-install-check.sh', runner.temp) || 'bash scripts/run_private_streaming_regression.sh' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: private-streaming-api${{ matrix.api }}
          path: |
            app/build/outputs/private-streaming-regression/
            app/build/outputs/private-streaming-screenshots/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14
