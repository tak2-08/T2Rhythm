name: Private phone streaming
on:
  pull_request:
    branches: ["main"]
    paths: ["app/**", "gradle/**", "scripts/run_private_streaming_regression.sh", ".github/workflows/private-streaming-regression.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-streaming-${{ github.ref }}
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  streaming:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            platform: "29"
          - api: 35
            platform: "35"
          - api: 37
            platform: "37.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update SDK tools for minor API versions
        if: matrix.api == 37
        shell: bash
        run: |
          # Old avdmanager writes target=android-0 for android-37.0. This causes
          # SurfaceFlinger/RegionSampling crash loops even after boot_completed.
          # sdkmanager is added to PATH by emulator-runner, which has not run yet.
          stream_sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$stream_sdkmanager" --licenses > /dev/null || true
          "$stream_sdkmanager" --install 'cmdline-tools;latest'
          if [[ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/t2-old-cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Build APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --console=plain
      - name: Verify encrypted hosting, playback and native flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.platform }}
          system-image-api-level: ${{ matrix.platform }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 4096M
          ram-size: ${{ matrix.api == 37 && '4096M' || '2048M' }}
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          pre-emulator-launch-script: |
            if [ '${{ matrix.api }}' = 37 ]; then
              python3 -c 'import os,pathlib; text=(pathlib.Path(os.environ["ANDROID_AVD_HOME"])/"test.ini").read_text(); print(text); assert "target=android-37.0" in text, "Update avdmanager before booting API37"'
            fi
          script: bash scripts/run_private_streaming_regression.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: private-streaming-api${{ matrix.api }}
          path: |
            app/build/outputs/private-streaming-regression/
            app/build/outputs/private-streaming-screenshots/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14
