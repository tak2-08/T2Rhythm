name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'zulu'
          cache: gradle

      - name: Prepare native packaging tools
        uses: ./.github/actions/setup-native-packaging

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lint --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: 'zulu'
        cache: gradle

    - name: Prepare native packaging tools
      uses: ./.github/actions/setup-native-packaging

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Create private.properties for build
      env:
        PRIVATE_PROPERTIES: ${{ secrets.PRIVATE_PROPERTIES }}
      run: |
        if [ -n "$PRIVATE_PROPERTIES" ]; then
          printf '%s' "$PRIVATE_PROPERTIES" | base64 -di > ./private.properties
        else
          touch ./private.properties
        fi

    - name: Build with Gradle (GitHub flavor only)
      env:
        APPLE_MUSIC_FALLBACK_TOKEN: ${{ secrets.APPLE_MUSIC_FALLBACK_TOKEN }}
      run: ./gradlew :app:assembleGithubRelease :app:assembleGithubDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain

    - name: Run unit tests
      run: ./gradlew :runtime-core:test :crawler:test :runtime-content:testGithubDebugUnitTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain

    - name: Upload runtime verification results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: runtime-core-test-results
        path: |
          runtime-core/build/test-results/test/*.xml
          crawler/build/test-results/test/*.xml
          runtime-content/build/test-results/testGithubDebugUnitTest/*.xml
        retention-days: 7

    - name: Generate build info
      if: github.event_name == 'pull_request'
      run: |
        echo "Build completed at: $(date)" > build_info.txt
        echo "Commit: ${{ github.sha }}" >> build_info.txt
        echo "Branch: ${{ github.head_ref }}" >> build_info.txt

    - name: Upload PR artifacts
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v7
      with:
        name: rhythm-pr-${{ github.event.pull_request.number }}
        path: |
          app/build/outputs/apk/github/release/*.apk
          app/build/outputs/apk/github/debug/*.apk
          build_info.txt
        retention-days: 14
