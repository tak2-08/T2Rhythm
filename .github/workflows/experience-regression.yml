name: Personal experience regression

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "crawler/**"
      - "runtime-*/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "scripts/run_personal_experience_regression.sh"
      - ".github/workflows/experience-regression.yml"
  workflow_dispatch:
    inputs:
      preservation:
        description: Run the pre-PR native behavior and visual preservation gate
        type: boolean
        default: false
      preservation_batch:
        description: Preservation groups to run (streaming repeats the affected flows after an invitation fix)
        type: choice
        options: [full, streaming, remaining, navigation, compat, genres, android15, fixes, runtime, native_app, native_update, native_full, native_diagnostics, native_release, native_upgrade]
        default: full
      baseline_ref:
        description: Baseline source for visual comparison
        type: string
        default: caead2d44b209c81ba774c79fd3b6bec4abbab63
      audit_only:
        description: Capture actual app navigation, large text, keyboard and landscape layouts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: experience-regression-${{ github.ref }}-${{ inputs.preservation_batch || 'full' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-regression:
    if: ${{ !inputs.preservation }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Prepare native packaging tools
        uses: ./.github/actions/setup-native-packaging

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --console=plain
      - name: Run media integrity and personal experience tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: ${{ inputs.audit_only && 'bash scripts/run_usability_audit.sh' || 'bash scripts/run_personal_experience_regression.sh' }}
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.audit_only && 'usability-audit' || 'personal-experience-regression' }}
          path: |
            app/build/outputs/experience-regression/
            app/build/outputs/experience-screenshots/
            app/build/outputs/usability-audit/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14

  preservation-android:
    if: ${{ inputs.preservation && inputs.preservation_batch != 'native_app' && inputs.preservation_batch != 'native_update' && inputs.preservation_batch != 'native_full' && inputs.preservation_batch != 'native_diagnostics' && inputs.preservation_batch != 'native_release' && inputs.preservation_batch != 'native_upgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.preservation_batch == 'native_release' && '[{"api":"26","group":"release_boot"},{"api":"35","group":"release_boot"},{"api":"37.0","group":"release_boot"}]' || inputs.preservation_batch == 'runtime' && '[{"api":"26","group":"runtime"},{"api":"29","group":"runtime"},{"api":"30","group":"runtime"},{"api":"35","group":"runtime"},{"api":"37.0","group":"runtime"}]' || inputs.preservation_batch == 'fixes' && '[{"api":"29","group":"fixes"},{"api":"35","group":"fixes"},{"api":"37.0","group":"fixes"}]' || inputs.preservation_batch == 'android15' && '[{"api":"35","group":"compat_remaining"},{"api":"35","group":"newflows"},{"api":"35","group":"baseline_newflows"}]' || inputs.preservation_batch == 'compat' && '[{"api":"35","group":"compat_remaining"}]' || (inputs.preservation_batch == 'navigation' || inputs.preservation_batch == 'genres') && '[{"api":"29","group":"navigation"},{"api":"35","group":"newflows"},{"api":"35","group":"baseline_newflows"},{"api":"37.0","group":"newflows"}]' || inputs.preservation_batch == 'remaining' && '[{"api":"29","group":"streaming"},{"api":"29","group":"visual_baseline"}]' || inputs.preservation_batch == 'streaming' && '[{"api":"29","group":"streaming"},{"api":"35","group":"newflows"},{"api":"35","group":"baseline_newflows"},{"api":"37.0","group":"streaming"},{"api":"37.0","group":"newflows"}]' || '[{"api":"29","group":"metadata"},{"api":"29","group":"persistence"},{"api":"29","group":"navigation"},{"api":"29","group":"streaming"},{"api":"35","group":"compat"},{"api":"35","group":"artwork"},{"api":"35","group":"newflows"},{"api":"35","group":"baseline_newflows"},{"api":"37.0","group":"streaming"},{"api":"37.0","group":"newflows"},{"api":"29","group":"visual_baseline"},{"api":"29","group":"visual_candidate"}]') }}
    env:
      GATE_PROJECT: ${{ matrix.group == 'visual_baseline' && 'baseline' || '.' }}
      PRESERVATION_MODEL: /tmp/t2-preservation-vosk.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: matrix.group == 'visual_baseline'
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Prepare native packaging tools
        uses: ./.github/actions/setup-native-packaging

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Allow unimplemented guest performance registers
        if: matrix.api == '35'
        run: |
          # Nested AMD KVM hosts can reject Android 15's WRMSR(0xc0010007).
          # Keep the guest alive when the host does not expose that performance counter.
          echo 1 | sudo tee /sys/module/kvm/parameters/ignore_msrs
          cat /sys/module/kvm/parameters/ignore_msrs
      - name: Download the verified Korean speech fixture
        if: matrix.group == 'persistence'
        run: |
          curl --fail --location --retry 2 https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip -o "$PRESERVATION_MODEL"
          echo "eea36124087fed26c59996a4761519458e3bd185e8ea9d9865ad8760c4a1d989  $PRESERVATION_MODEL" | sha256sum -c -
      - name: Update SDK tools for minor API versions
        if: matrix.api == '37.0'
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk_manager" --licenses > /dev/null || true
          "$sdk_manager" --install 'cmdline-tools;latest'
          if [[ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/t2-old-cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi
      - name: Build native APKs
        working-directory: ${{ env.GATE_PROJECT }}
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - name: Run preservation assertions and capture actual screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == '35' && 'google_atd' || 'google_apis' }}
          profile: pixel_2
          ram-size: ${{ matrix.api == '37.0' && '4096M' || '3072M' }}
          heap-size: 512M
          # Android 15 crashes in the current 37.2.12 host emulator during UI tests.
          # 36.4.9 is an official archived stable build; API 37 keeps the current emulator.
          emulator-build: ${{ matrix.api == '35' && '14788078' || '' }}
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot-save
          pre-emulator-launch-script: >-
            python3 -c 'import os,pathlib; text=(pathlib.Path(os.environ["ANDROID_AVD_HOME"])/"test.ini").read_text(); print(text); assert "${{ matrix.api }}" != "37.0" or "target=android-37.0" in text'
          script: python3 scripts/run_preservation_gate.py --project "$GATE_PROJECT" --group "${{ matrix.group }}" --output "preservation-results/${{ matrix.group }}-api${{ matrix.api }}"
      - name: Retain emulator host diagnostics after a failed assertion
        if: failure()
        run: |
          mkdir -p preservation-results/host
          free -m > preservation-results/host/memory.txt
          sudo dmesg | tail -n 160 > preservation-results/host/kernel.txt || true
          cp /tmp/android-runner/emu-crash* preservation-results/host/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preservation-${{ matrix.group }}-api${{ matrix.api }}
          path: preservation-results/
          retention-days: 14

  preservation-checks:
    if: ${{ inputs.preservation && inputs.preservation_batch != 'native_app' && inputs.preservation_batch != 'native_update' && inputs.preservation_batch != 'native_full' && inputs.preservation_batch != 'native_diagnostics' && inputs.preservation_batch != 'native_release' && inputs.preservation_batch != 'native_upgrade' && inputs.preservation_batch != 'navigation' && inputs.preservation_batch != 'compat' && inputs.preservation_batch != 'android15' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Prepare native packaging tools
        uses: ./.github/actions/setup-native-packaging

      - name: Verify unit regressions and translations
        run: |
          ./gradlew :runtime-core:test :crawler:test :runtime-content:testGithubDebugUnitTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx4g -Pkotlin.compiler.execution.strategy=in-process --console=plain
          python3 scripts/check_plural_specifiers.py
          git diff --check
      - name: Verify native lint
        run: timeout 900s ./gradlew :app:lintGithubDebug :runtime-host:lintDebug :runtime-api:lintDebug :runtime-probe:lintDebug :runtime-resource-probe:lintDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx4g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preservation-unit-lint
          path: |
            runtime-content/build/test-results/
            crawler/build/test-results/
            runtime-core/build/test-results/
            app/build/reports/lint-results*
            runtime-host/build/reports/lint-results*
            runtime-api/build/reports/lint-results*
            runtime-probe/build/reports/lint-results*
            runtime-resource-probe/build/reports/lint-results*
          retention-days: 14

  native-app-build:
    if: ${{ inputs.preservation && (inputs.preservation_batch == 'native_app' || inputs.preservation_batch == 'native_update' || inputs.preservation_batch == 'native_full' || inputs.preservation_batch == 'native_diagnostics' || inputs.preservation_batch == 'native_release' || inputs.preservation_batch == 'native_upgrade') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Prepare native packaging tools
        uses: ./.github/actions/setup-native-packaging

      - uses: actions/checkout@v7
        if: inputs.preservation_batch == 'native_full' || inputs.preservation_batch == 'native_diagnostics' || inputs.preservation_batch == 'native_upgrade'
        with:
          ref: ${{ inputs.baseline_ref }}
          path: native-baseline-source
      - name: Build the original APK with the same Android signing identity for upgrade preservation
        if: inputs.preservation_batch == 'native_full' || inputs.preservation_batch == 'native_diagnostics' || inputs.preservation_batch == 'native_upgrade'
        run: |
          mkdir -p native-baseline-source/app/src/androidTest/java/chromahub/rhythm/app/features/runtime
          cp scripts/fixtures/LegacyUpgradeSeedTest.kt native-baseline-source/app/src/androidTest/java/chromahub/rhythm/app/features/runtime/
          cp app/src/androidTest/java/chromahub/rhythm/app/features/streaming/PrivateStreamingFlowTest.kt native-baseline-source/app/src/androidTest/java/chromahub/rhythm/app/features/streaming/PrivateStreamingFlowTest.kt
          cp app/src/androidTest/java/chromahub/rhythm/app/features/local/presentation/metadata/UsabilityAuditTest.kt native-baseline-source/app/src/androidTest/java/chromahub/rhythm/app/features/local/presentation/metadata/UsabilityAuditTest.kt
          cp app/src/androidTest/java/chromahub/rhythm/app/features/local/presentation/metadata/LearningFileNamesTest.kt native-baseline-source/app/src/androidTest/java/chromahub/rhythm/app/features/local/presentation/metadata/LearningFileNamesTest.kt
          cd native-baseline-source
          ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest \
            --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
          cd ..
          mkdir -p native-baseline-artifacts
          for apk in native-baseline-source/app/build/outputs/apk/github/debug/*.apk; do
            case "$apk" in *-arm64-v8a.apk|*-armeabi-v7a.apk|*-x86_64.apk|*-x86.apk) continue ;; esac
            cp "$apk" native-baseline-artifacts/legacy.apk
          done
          cp native-baseline-source/app/build/outputs/apk/androidTest/github/debug/app-github-debug-androidTest.apk native-baseline-artifacts/legacy-test.apk
          test -s native-baseline-artifacts/legacy.apk
      - name: Create temporary integration trust outside artifacts
        run: |
          python3 -m pip install --disable-pip-version-check cryptography==46.0.3
          python3 - <<'PYKEY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          key = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          path = Path(os.environ['RUNNER_TEMP']) / 'native-integration.pk8'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(key.private_bytes(serialization.Encoding.DER, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))
          PYKEY
      - name: Build the actual base app with independently signed offline music and its original tests
        if: inputs.preservation_batch != 'native_release'
        run: >-
          ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest
          "-PruntimeSigningKey=$RUNNER_TEMP/native-integration.pk8" -PruntimeTestOnly=true
          -PversionCodeOverride=554991327 -PversionNameOverride=5.5.499.1327
          --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g
          -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - name: Build the release base and release instrumentation against the actual unshrunk production SDK
        if: inputs.preservation_batch == 'native_release'
        run: >-
          ./gradlew :app:assembleGithubRelease :app:assembleGithubReleaseAndroidTest
          "-PruntimeSigningKey=$RUNNER_TEMP/native-integration.pk8" -PruntimeTestOnly=true -PnativeTestBuildType=release
          -PversionCodeOverride=554991327 -PversionNameOverride=5.5.499.1327
          --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - name: Compile a real next feature with a new resource and build test-only failure fixtures
        if: inputs.preservation_batch == 'native_update'
        run: |
          cp app/build/outputs/apk/github/debug/Rhythm-5.5.499.1327-githubDebug.apk "$RUNNER_TEMP/native-base-v1.apk"
          mkdir -p runtime-content/src/main/res/values
          cat > runtime-content/src/main/res/values/native_update_fixture.xml <<'XML'
          <resources><string name="runtime_update_fixture" translatable="false">New resource from independent feature v2</string></resources>
          XML
          ./gradlew :runtime-content:dexGithubDebugFeature :runtime-content:assembleGithubDebug :runtime-content:exportGithubDebugSharedContract \
            --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process \
            -PversionCodeOverride=554991328 -PversionNameOverride=5.5.499.1328 --console=plain
          python3 scripts/prepare_runtime_distribution.py \
            --apk runtime-content/build/outputs/apk/github/debug/runtime-content-github-debug.apk \
            --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2" \
            --dex runtime-content/build/outputs/runtime-feature/githubDebug/content.dex.jar \
            --shared-contract runtime-content/build/outputs/runtime-feature/githubDebug/shared-contract.json \
            --database-implementation runtime-content/build/generated/ksp/githubDebug/kotlin/chromahub/rhythm/app/features/local/data/database/RhythmDatabase_Impl.kt \
            --private-key "$RUNNER_TEMP/native-integration.pk8" --notes app/src/main/res/raw/current_release_notes.txt \
            --version-code 554991328 --version-name 5.5.499.1328-gh-debug --out "$RUNNER_TEMP/native-next" --test-only
          python3 - <<'PYCONTRACT'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          before = json.loads((Path('build/runtime-distribution/githubDebug/distribution.json')).read_text())
          after = json.loads((root / 'native-next/distribution.json').read_text())
          assert before['manifest']['runtimeFingerprint'] == after['manifest']['runtimeFingerprint'], 'The next feature changed the fixed SDK'
          PYCONTRACT
          python3 scripts/build_native_lifecycle_fixtures.py --next-distribution "$RUNNER_TEMP/native-next" \
            --private-key "$RUNNER_TEMP/native-integration.pk8" --out "$RUNNER_TEMP/native-lifecycle-fixtures"
          ./gradlew :app:assembleGithubDebugAndroidTest \
            "-PruntimeDistributionDir=$GITHUB_WORKSPACE/build/runtime-distribution/githubDebug" "-PruntimeLifecycleFixturesDir=$RUNNER_TEMP/native-lifecycle-fixtures" \
            -PruntimeTestOnly=true -PversionCodeOverride=554991327 -PversionNameOverride=5.5.499.1327 \
            --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
          cp "$RUNNER_TEMP/native-base-v1.apk" app/build/outputs/apk/github/debug/Rhythm-5.5.499.1327-githubDebug.apk
      - name: Audit class ownership and Android 8 desugared methods
        if: inputs.preservation_batch != 'native_release'
        run: >-
          python3 scripts/audit_runtime_classpath.py
          --base app/build/outputs/apk/github/debug/Rhythm-5.5.499.1327-githubDebug.apk
          --feature-dex runtime-content/build/outputs/runtime-feature/githubDebug/content.dex.jar
          --out app/build/reports/native-classpath.json
      - name: Audit the actual release Java backport ABI
        if: inputs.preservation_batch == 'native_release'
        run: >-
          python3 scripts/audit_runtime_classpath.py
          --base app/build/outputs/apk/github/release/Rhythm-5.5.499.1327-githubRelease.apk
          --feature-dex runtime-content/build/outputs/runtime-feature/githubRelease/content.dex.jar
          --out app/build/reports/native-release-classpath.json
      - name: Verify unit regressions
        run: >-
          ./gradlew :runtime-core:test :crawler:test :runtime-content:testGithubDebugUnitTest
          --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g
          -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-app-build
          path: |
            native-baseline-artifacts/*.apk
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/github/release/*.apk
            app/build/outputs/apk/androidTest/github/release/*.apk
            app/build/outputs/apk/androidTest/github/debug/*.apk
            runtime-content/build/outputs/runtime-feature/githubDebug/shared-contract.json
            app/build/reports/
            build/runtime-distribution/githubDebug/*.json
            runtime-content/build/test-results/
            crawler/build/test-results/
            runtime-core/build/test-results/
          retention-days: 14

  native-app-android:
    if: ${{ inputs.preservation && (inputs.preservation_batch == 'native_app' || inputs.preservation_batch == 'native_update' || inputs.preservation_batch == 'native_full' || inputs.preservation_batch == 'native_diagnostics' || inputs.preservation_batch == 'native_release' || inputs.preservation_batch == 'native_upgrade') }}
    needs: native-app-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.preservation_batch == 'native_upgrade' && '[{"api":"29","group":"upgrade_visual"}]' || inputs.preservation_batch == 'native_release' && '[{"api":"26","group":"release_boot"},{"api":"35","group":"release_boot"},{"api":"37.0","group":"release_boot"}]' || inputs.preservation_batch == 'native_diagnostics' && '[{"api":"29","group":"file_names"},{"api":"29","group":"baseline_file_names"}]' || inputs.preservation_batch == 'native_full' && '[{"api":"29","group":"metadata"},{"api":"29","group":"persistence"},{"api":"29","group":"navigation"},{"api":"29","group":"streaming"},{"api":"29","group":"fixes"},{"api":"29","group":"upgrade_visual"},{"api":"35","group":"compat_remaining"},{"api":"35","group":"artwork"},{"api":"35","group":"newflows"},{"api":"35","group":"baseline_newflows"},{"api":"37.0","group":"streaming"},{"api":"37.0","group":"newflows"},{"api":"37.0","group":"fixes"}]' || '[{"api":"26","group":"native_boot"},{"api":"29","group":"native_boot"},{"api":"30","group":"native_boot"},{"api":"35","group":"native_boot"},{"api":"37.0","group":"native_boot"}]') }}
    env:
      PRESERVATION_MODEL: /tmp/t2-preservation-vosk.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-app-build
      - name: Download verified Korean speech fixture
        if: matrix.group == 'persistence'
        run: |
          curl --fail --location --retry 2 https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip -o "$PRESERVATION_MODEL"
          echo "eea36124087fed26c59996a4761519458e3bd185e8ea9d9865ad8760c4a1d989  $PRESERVATION_MODEL" | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Allow unimplemented guest performance registers
        if: matrix.api == '35'
        run: echo 1 | sudo tee /sys/module/kvm/parameters/ignore_msrs
      - name: Update SDK tools for minor API versions
        if: matrix.api == '37.0'
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk_manager" --licenses > /dev/null || true
          "$sdk_manager" --install 'cmdline-tools;latest'
          if [[ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/t2-old-cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi
      - name: Run the real music UI, installed playback service and persisted worker through the native feature loader
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == '35' && 'google_atd' || 'google_apis' }}
          profile: pixel_2
          ram-size: ${{ matrix.api == '37.0' && '4096M' || '3072M' }}
          heap-size: 512M
          emulator-build: ${{ matrix.api == '35' && '14788078' || '' }}
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot-save
          script: bash scripts/run_native_app_gate.sh "${{ matrix.api }}" "${{ inputs.preservation_batch }}" "${{ matrix.group }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-app-${{ matrix.group }}-api${{ matrix.api }}
          path: native-results/
          retention-days: 14
