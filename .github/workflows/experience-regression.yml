name: Personal experience regression

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "crawler/**"
      - "runtime-*/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "scripts/run_personal_experience_regression.sh"
      - ".github/workflows/experience-regression.yml"
  workflow_dispatch:
    inputs:
      preservation:
        description: Run the pre-PR native behavior and visual preservation gate
        type: boolean
        default: false
      preservation_batch:
        description: Preservation groups to run (streaming repeats the affected flows after an invitation fix)
        type: choice
        options: [full, streaming, remaining, navigation, compat, genres, android15, fixes, runtime, native_app]
        default: full
      baseline_ref:
        description: Baseline source for visual comparison
        type: string
        default: caead2d44b209c81ba774c79fd3b6bec4abbab63
      audit_only:
        description: Capture actual app navigation, large text, keyboard and landscape layouts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: experience-regression-${{ github.ref }}-${{ inputs.preservation_batch || 'full' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-regression:
    if: ${{ !inputs.preservation }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --console=plain
      - name: Run media integrity and personal experience tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: ${{ inputs.audit_only && 'bash scripts/run_usability_audit.sh' || 'bash scripts/run_personal_experience_regression.sh' }}
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.audit_only && 'usability-audit' || 'personal-experience-regression' }}
          path: |
            app/build/outputs/experience-regression/
            app/build/outputs/experience-screenshots/
            app/build/outputs/usability-audit/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14

  preservation-android:
    if: ${{ inputs.preservation && inputs.preservation_batch != 'native_app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.preservation_batch == 'runtime' && '[{"api":"26","group":"runtime"},{"api":"29","group":"runtime"},{"api":"30","group":"runtime"},{"api":"35","group":"runtime"},{"api":"37.0","group":"runtime"}]' || inputs.preservation_batch == 'fixes' && '[{"api":"29","group":"fixes"},{"api":"35","group":"fixes"},{"api":"37.0","group":"fixes"}]' || inputs.preservation_batch == 'android15' && '[{"api":"35","group":"compat_remaining"},{"api":"35","group":"newflows"}]' || inputs.preservation_batch == 'compat' && '[{"api":"35","group":"compat_remaining"}]' || (inputs.preservation_batch == 'navigation' || inputs.preservation_batch == 'genres') && '[{"api":"29","group":"navigation"},{"api":"35","group":"newflows"},{"api":"37.0","group":"newflows"}]' || inputs.preservation_batch == 'remaining' && '[{"api":"29","group":"streaming"},{"api":"29","group":"visual_baseline"}]' || inputs.preservation_batch == 'streaming' && '[{"api":"29","group":"streaming"},{"api":"35","group":"newflows"},{"api":"37.0","group":"streaming"},{"api":"37.0","group":"newflows"}]' || '[{"api":"29","group":"metadata"},{"api":"29","group":"persistence"},{"api":"29","group":"navigation"},{"api":"29","group":"streaming"},{"api":"35","group":"compat"},{"api":"35","group":"artwork"},{"api":"35","group":"newflows"},{"api":"37.0","group":"streaming"},{"api":"37.0","group":"newflows"},{"api":"29","group":"visual_baseline"},{"api":"29","group":"visual_candidate"}]') }}
    env:
      GATE_PROJECT: ${{ matrix.group == 'visual_baseline' && 'baseline' || '.' }}
      PRESERVATION_MODEL: /tmp/t2-preservation-vosk.zip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        if: matrix.group == 'visual_baseline'
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Allow unimplemented guest performance registers
        if: matrix.api == '35'
        run: |
          # Nested AMD KVM hosts can reject Android 15's WRMSR(0xc0010007).
          # Keep the guest alive when the host does not expose that performance counter.
          echo 1 | sudo tee /sys/module/kvm/parameters/ignore_msrs
          cat /sys/module/kvm/parameters/ignore_msrs
      - name: Download the verified Korean speech fixture
        if: matrix.group == 'persistence'
        run: |
          curl --fail --location --retry 2 https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip -o "$PRESERVATION_MODEL"
          echo "eea36124087fed26c59996a4761519458e3bd185e8ea9d9865ad8760c4a1d989  $PRESERVATION_MODEL" | sha256sum -c -
      - name: Update SDK tools for minor API versions
        if: matrix.api == '37.0'
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk_manager" --licenses > /dev/null || true
          "$sdk_manager" --install 'cmdline-tools;latest'
          if [[ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/t2-old-cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi
      - name: Build native APKs
        working-directory: ${{ env.GATE_PROJECT }}
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - name: Run preservation assertions and capture actual screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == '35' && 'google_atd' || 'google_apis' }}
          profile: pixel_2
          ram-size: ${{ matrix.api == '37.0' && '4096M' || '3072M' }}
          heap-size: 512M
          # Android 15 crashes in the current 37.2.12 host emulator during UI tests.
          # 36.4.9 is an official archived stable build; API 37 keeps the current emulator.
          emulator-build: ${{ matrix.api == '35' && '14788078' || '' }}
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot-save
          pre-emulator-launch-script: >-
            python3 -c 'import os,pathlib; text=(pathlib.Path(os.environ["ANDROID_AVD_HOME"])/"test.ini").read_text(); print(text); assert "${{ matrix.api }}" != "37.0" or "target=android-37.0" in text'
          script: python3 scripts/run_preservation_gate.py --project "$GATE_PROJECT" --group "${{ matrix.group }}" --output "preservation-results/${{ matrix.group }}-api${{ matrix.api }}"
      - name: Retain emulator host diagnostics after a failed assertion
        if: failure()
        run: |
          mkdir -p preservation-results/host
          free -m > preservation-results/host/memory.txt
          sudo dmesg | tail -n 160 > preservation-results/host/kernel.txt || true
          cp /tmp/android-runner/emu-crash* preservation-results/host/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preservation-${{ matrix.group }}-api${{ matrix.api }}
          path: preservation-results/
          retention-days: 14

  preservation-checks:
    if: ${{ inputs.preservation && inputs.preservation_batch != 'native_app' && inputs.preservation_batch != 'navigation' && inputs.preservation_batch != 'compat' && inputs.preservation_batch != 'android15' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Verify unit regressions and translations
        run: |
          ./gradlew :runtime-core:test :crawler:test :app:testGithubDebugUnitTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx4g -Pkotlin.compiler.execution.strategy=in-process --console=plain
          python3 scripts/check_plural_specifiers.py
          git diff --check
      - name: Verify native lint
        run: timeout 900s ./gradlew :app:lintGithubDebug :runtime-host:lintDebug :runtime-api:lintDebug :runtime-probe:lintDebug :runtime-resource-probe:lintDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx4g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preservation-unit-lint
          path: |
            app/build/test-results/
            crawler/build/test-results/
            runtime-core/build/test-results/
            app/build/reports/lint-results*
            runtime-host/build/reports/lint-results*
            runtime-api/build/reports/lint-results*
            runtime-probe/build/reports/lint-results*
            runtime-resource-probe/build/reports/lint-results*
          retention-days: 14

  native-app-build:
    if: ${{ inputs.preservation && inputs.preservation_batch == 'native_app' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Create temporary integration trust outside artifacts
        run: |
          python3 -m pip install --disable-pip-version-check cryptography==46.0.3
          python3 - <<'PYKEY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          key = rsa.generate_private_key(public_exponent=65537, key_size=3072)
          path = Path(os.environ['RUNNER_TEMP']) / 'native-integration.pk8'
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'wb') as stream:
              stream.write(key.private_bytes(serialization.Encoding.DER, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))
          PYKEY
      - name: Build independently compiled music feature and original test compile input
        run: >-
          ./gradlew :runtime-content:dexDebugFeature :runtime-content:assembleDebug
          :runtime-content:exportDebugSharedContract :runtime-app-base:compileDebugAndroidTestKotlin
          :runtime-app-base:compileDebugAndroidTestJavaWithJavac
          --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g
          -Pkotlin.compiler.execution.strategy=in-process -PversionCodeOverride=554991327
          -PversionNameOverride=5.5.499.1327 --console=plain
      - name: Verify resource and database contracts and sign the test-only feature
        run: >-
          python3 scripts/prepare_runtime_distribution.py
          --apk runtime-content/build/outputs/apk/debug/runtime-content-debug.apk
          --aapt2 "$ANDROID_HOME/build-tools/37.0.0/aapt2"
          --dex runtime-content/build/outputs/runtime-feature/debug/content.dex.jar
          --shared-contract runtime-content/build/outputs/runtime-feature/debug/shared-contract.json
          --database-implementation runtime-content/build/generated/ksp/debug/kotlin/chromahub/rhythm/app/features/local/data/database/RhythmDatabase_Impl.kt
          --private-key "$RUNNER_TEMP/native-integration.pk8"
          --notes app/src/main/res/raw/current_release_notes.txt
          --version-code 554991327 --version-name 5.5.499.1327-gh-debug
          --out "$RUNNER_TEMP/native-distribution" --test-only
      - name: Build fixed base APK with embedded offline music and separate test APK
        run: >-
          ./gradlew :runtime-app-base:assembleDebug :runtime-app-base:assembleDebugAndroidTest
          "-PruntimeDistributionDir=$RUNNER_TEMP/native-distribution" -PruntimeTestOnly=true
          -PversionCodeOverride=554991327 -PversionNameOverride=5.5.499.1327
          --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g
          -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - name: Audit class ownership and Android 8 desugared methods
        run: >-
          python3 scripts/audit_runtime_classpath.py
          --base runtime-app-base/build/outputs/apk/debug/runtime-app-base-debug.apk
          --feature-dex runtime-content/build/outputs/runtime-feature/debug/content.dex.jar
          --out runtime-app-base/build/reports/native-classpath.json
      - name: Verify unit regressions
        run: >-
          ./gradlew :runtime-core:test :crawler:test :app:testGithubDebugUnitTest
          --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g
          -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-app-build
          path: |
            runtime-app-base/build/outputs/apk/debug/*.apk
            runtime-app-base/build/outputs/apk/androidTest/debug/*.apk
            runtime-content/build/outputs/runtime-feature/debug/shared-contract.json
            runtime-app-base/build/reports/
            app/build/test-results/
            crawler/build/test-results/
            runtime-core/build/test-results/
          retention-days: 14

  native-app-android:
    if: ${{ inputs.preservation && inputs.preservation_batch == 'native_app' }}
    needs: native-app-build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: ['26', '29', '30', '35', '37.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-app-build
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Allow unimplemented guest performance registers
        if: matrix.api == '35'
        run: echo 1 | sudo tee /sys/module/kvm/parameters/ignore_msrs
      - name: Update SDK tools for minor API versions
        if: matrix.api == '37.0'
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdk_manager" --licenses > /dev/null || true
          "$sdk_manager" --install 'cmdline-tools;latest'
          if [[ -d "$ANDROID_HOME/cmdline-tools/latest-2" ]]; then
            mv "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/t2-old-cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/latest-2" "$ANDROID_HOME/cmdline-tools/latest"
          fi
      - name: Run the real music UI, installed playback service and persisted worker through the native feature loader
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          system-image-api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.api == '35' && 'google_atd' || 'google_apis' }}
          profile: pixel_2
          ram-size: ${{ matrix.api == '37.0' && '4096M' || '3072M' }}
          heap-size: 512M
          emulator-build: ${{ matrix.api == '35' && '14788078' || '' }}
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot-save
          script: python3 scripts/run_preservation_gate.py --native-base --group native_boot --output "native-results/api${{ matrix.api }}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-app-api${{ matrix.api }}
          path: native-results/
          retention-days: 14
