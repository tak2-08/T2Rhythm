name: File name Android compatibility

on:
  pull_request:
    branches: ["main"]
    paths:
      - "app/**"
      - "crawler/**"
      - "gradle/**"
      - "scripts/run_personal_experience_regression.sh"
      - ".github/workflows/file-name-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-name-compatibility-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  android-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: zulu
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and instrumentation APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g --console=plain
      - name: Run scoped storage and learning tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 4096M
          ram-size: 2048M
          heap-size: 512M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: FILE_NAME_COMPAT_ONLY=1 bash scripts/run_personal_experience_regression.sh
      - name: Upload regression reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: file-name-api35-compatibility
          path: |
            app/build/outputs/experience-regression/
            app/build/outputs/experience-screenshots/
            app/build/outputs/usability-audit/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14
