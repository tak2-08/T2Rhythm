name: Search keyboard regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'runtime-*/**'
      - 'gradle/**'
      - 'scripts/run_personal_experience_regression.sh'
      - '.github/workflows/search-keyboard-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ['29', '35', '37.0']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle
      - uses: ./.github/actions/setup-native-packaging
      - name: Select the exact source keyboard regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/run_personal_experience_regression.sh')
          s = p.read_text()
          s = re.sub(r'classes=\(.*?\n\)', 'classes=(chromahub.rhythm.app.features.local.presentation.metadata.LibrarySearchNavigationTest)', s, count=1, flags=re.S)
          s = re.sub(r'expected_counts=\([^\n]*\)', 'expected_counts=(1)', s, count=1)
          s = s.replace('--max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g', '--max-workers=1 -Dorg.gradle.jvmargs=-Xmx1536m')
          p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Allow unsupported guest performance registers
        if: matrix.api == '35'
        run: |
          echo 1 | sudo tee /sys/module/kvm/parameters/ignore_msrs
          cat /sys/module/kvm/parameters/ignore_msrs
      - name: Build the exact source APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: ${{ matrix.api == '37.0' && '4096M' || '2048M' }}
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: |
            mkdir -p app/build/outputs/experience-screenshots
            free -m > app/build/outputs/experience-screenshots/host-memory.txt
            adb shell ime list -s > app/build/outputs/experience-screenshots/input-methods.txt
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb logcat -b all -v threadtime > app/build/outputs/experience-screenshots/continuous-logcat.txt &
            for pass in 1 2 3; do
              timeout --kill-after=15s 360s bash scripts/run_personal_experience_regression.sh
              mkdir -p app/build/outputs/experience-screenshots/pass-$pass
              cp app/build/outputs/experience-screenshots/*.png app/build/outputs/experience-screenshots/pass-$pass/
            done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: search-keyboard-api${{ matrix.api }}
          path: |
            app/build/outputs/experience-regression/
            app/build/outputs/experience-screenshots/
          retention-days: 7
          overwrite: true
