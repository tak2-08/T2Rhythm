name: Focused 1332 modern keyboard visual gate
on:
  push:
    branches: [codex/keyboard-1332-modern]
permissions:
  contents: read
  actions: write
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: ['35', '37.0']
    steps:
      - name: Cancel the superseded keyboard run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/tak2-08/T2Rhythm/actions/runs/40509915055/cancel || true
      - uses: actions/checkout@v7
        with:
          ref: 4032e1807fc863d4daff710a11af4d78b568bcc1
      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: zulu
          cache: gradle
      - uses: ./.github/actions/setup-native-packaging
      - name: Select the exact source keyboard regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('scripts/run_personal_experience_regression.sh')
          s = p.read_text()
          s = re.sub(r'classes=\(.*?\n\)', 'classes=(chromahub.rhythm.app.features.local.presentation.metadata.LibrarySearchNavigationTest)', s, count=1, flags=re.S)
          s = re.sub(r'expected_counts=\([^\n]*\)', 'expected_counts=(1)', s, count=1)
          s = s.replace('--max-workers=2 -Dorg.gradle.jvmargs=-Xmx3g', '--max-workers=1 -Dorg.gradle.jvmargs=-Xmx1536m')
          p.write_text(s)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build the exact source APKs
        run: ./gradlew :app:assembleGithubDebug :app:assembleGithubDebugAndroidTest --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx3g -Pkotlin.compiler.execution.strategy=in-process --console=plain
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: ${{ matrix.api == '37.0' && '4096M' || '2048M' }}
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -noaudio -no-boot-anim -no-snapshot-save
          script: |
            mkdir -p app/build/outputs/experience-screenshots
            free -m > app/build/outputs/experience-screenshots/host-memory.txt
            adb logcat -b all -v threadtime > app/build/outputs/experience-screenshots/continuous-logcat.txt &
            timeout --kill-after=15s 360s bash scripts/run_personal_experience_regression.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keyboard-1332-4032-api${{ matrix.api }}
          path: |
            app/build/outputs/experience-regression/
            app/build/outputs/experience-screenshots/
          retention-days: 7
          overwrite: true
